<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Montana Metal</title>
    <link rel="stylesheet" href="administrador.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Barra Lateral de Navegação -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Painel ADM</h3>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="active">Início</a>
                <a href="#cadastro" id="btnMenuCadastro">Cadastrar Projeto</a>
                <a href="#" class="logout-link">Sair</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="main-header">
                <h1>Bem-vinda, Giselly</h1>
                <p>Gerencie seus projetos e ordens de serviço.</p>
            </header>

            <!-- Card Formulário de Cadastro -->
            <section class="content-section" id="cadastroSection">
                <div class="form-container">
                    <h2>Cadastrar Novo Projeto</h2>
                    <form id="cadastroProjetoForm">
                        <div class="input-group">
                            <label for="nomeProjeto">Nome do Projeto</label>
                            <input type="text" id="nomeProjeto" required placeholder="Ex: Estrutura Metálica Galpão X">
                        </div>

                        <div class="input-group">
                            <label for="descricaoProjeto">Descrição</label>
                            <textarea id="descricaoProjeto" rows="4" required placeholder="Detalhes técnicos do projeto..."></textarea>
                        </div>

                        <div class="input-group">
                            <label for="prazoProjeto">Prazo de Entrega</label>
                            <input type="date" id="prazoProjeto" required>
                        </div>

                        <!-- Área Customizada de Anexar Arquivos -->
                        <div class="input-group">
                            <label>Anexar Arquivos (Imagens, Vídeos ou PDFs)</label>
                            <label for="arquivosProjeto" class="file-drop-area">
                                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path></svg>
                                <span>Clique aqui para selecionar os arquivos</span>
                                <span class="file-info">Suporta imagens, vídeos ou documentos</span>
                            </label>
                            <input type="file" id="arquivosProjeto" multiple accept="image/*,video/*,application/pdf" style="display: none;">
                        </div>

                        <button type="submit" class="btn-salvar">Salvar Projeto</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
